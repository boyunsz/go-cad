name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            example/go.sum
      - run: go vet ./...
      - run: go -C example vet ./...
      - run: go test ./...
      - run: go test -race ./internal/bitstream/... ./internal/drawing/... ./internal/entity/... ./internal/object/...
      - run: go test -race -run "TestConcurrent|TestFontCache|TestSVG|TestXref" ./internal/render/...
      - run: go -C example test ./...
      - run: go build ./...
      - run: go -C example build -o "${RUNNER_TEMP}/cad-example" .
